<svg xmlns="http://www.w3.org/2000/svg" viewBox="-149.1 -21.8 298.2 204.8" width="298.2" height="204.8" fill="none" stroke="#0b0f12" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><title>A record disc</title><defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#f5f7f9"/><stop offset="1" stop-color="#e6ecf0"/></linearGradient></defs><style>
.route{stroke:#06cbde;stroke-width:3.2}
.pulse{stroke:#fff;stroke-width:1.7;stroke-dasharray:0.1 21;animation:flow 2.6s linear infinite}
.pulse.slow{animation-duration:3.6s}
@keyframes flow{to{stroke-dashoffset:-20.9}}
.bob{animation:bob 5s ease-in-out infinite}
.bob2{animation:bob 6.5s ease-in-out -2s infinite}
@keyframes bob{50%{transform:translateY(-3.6px)}}
.press{animation:press 4.5s ease-in-out infinite}
@keyframes press{0%,55%,100%{transform:translateY(-14.3px)}68%,76%{transform:translateY(0)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 4.5s ease-out infinite;opacity:0}
@keyframes ping{0%,66%{opacity:0;transform:scale(.8)}70%{opacity:.9}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.pulse,.bob,.bob2,.press,.ping{animation:none}.press{transform:translateY(0)}}</style><polygon points="-135.1,91 0,169 0,156 -135.1,78" fill="#e3eaee"/><polygon points="135.1,91 0,169 0,156 135.1,78" fill="#d5dde2"/><polygon points="0,0 135.1,78 0,156 -135.1,78" fill="#eef3f5"/><path d="M-73.2 78A73.2 42.3 0 0 0 73.2 78L73.2 70.2L-73.2 70.2Z" fill="url(#cg)"/><ellipse cx="0" cy="70.2" rx="73.2" ry="42.3" fill="#fff"/><g><g transform="matrix(22.517 13.000 -22.517 13.000 0 -7.8)"><circle cx="3" cy="3" r="1.3" stroke="#0b0f12" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"/><circle cx="3" cy="3" r="0.45" fill="#06cbde" stroke="none"/><path d="M3 1.7A1.3 1.3 0 0 1 4.3 3" stroke="#06cbde" stroke-width="2.4" fill="none" vector-effect="non-scaling-stroke"/></g></g></svg>