<svg xmlns="http://www.w3.org/2000/svg" viewBox="-149.1 -40 298.2 223" width="298.2" height="223" fill="none" stroke="#0b0f12" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><title>A cube marked with code brackets</title><defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#f5f7f9"/><stop offset="1" stop-color="#e6ecf0"/></linearGradient></defs><style>
.route{stroke:#06cbde;stroke-width:3.2}
.pulse{stroke:#fff;stroke-width:1.7;stroke-dasharray:0.1 21;animation:flow 2.6s linear infinite}
.pulse.slow{animation-duration:3.6s}
@keyframes flow{to{stroke-dashoffset:-20.9}}
.bob{animation:bob 5s ease-in-out infinite}
.bob2{animation:bob 6.5s ease-in-out -2s infinite}
@keyframes bob{50%{transform:translateY(-3.6px)}}
.press{animation:press 4.5s ease-in-out infinite}
@keyframes press{0%,55%,100%{transform:translateY(-14.3px)}68%,76%{transform:translateY(0)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 4.5s ease-out infinite;opacity:0}
