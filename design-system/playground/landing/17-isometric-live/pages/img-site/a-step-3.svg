<svg xmlns="http://www.w3.org/2000/svg" viewBox="-257.6 -22 515.1 350" width="515.1" height="350" fill="none" stroke="#0b0f12" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><title>A human approves: a checked card and the stamp that approved it.</title><defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#f5f7f9"/><stop offset="1" stop-color="#e6ecf0"/></linearGradient></defs><style>
.route{stroke:#06cbde;stroke-width:3.4}
.pulse{stroke:#fff;stroke-width:1.8;stroke-dasharray:0.1 27;animation:flow 2.6s linear infinite}
.pulse.slow{animation-duration:3.6s}
@keyframes flow{to{stroke-dashoffset:-27.3}}
.bob{animation:bob 5s ease-in-out infinite}
.bob2{animation:bob 6.5s ease-in-out -2s infinite}
@keyframes bob{50%{transform:translateY(-4.8px)}}
.press{animation:press 4.5s ease-in-out infinite}
@keyframes press{0%,55%,100%{transform:translateY(-18.7px)}68%,76%{transform:translateY(0)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 4.5s ease-out infinite;opacity:0}
@keyframes ping{0%,66%{opacity:0;transform:scale(.8)}70%{opacity:.9}100%{opacity:0;transform:scale(1.5)}}
