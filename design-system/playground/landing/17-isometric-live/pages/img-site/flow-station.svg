<svg xmlns="http://www.w3.org/2000/svg" viewBox="-332.8 -110 665.5 535.6" width="665.5" height="535.6" fill="none" stroke="#0b0f12" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><title>A close-up of the Flow station: a microphone sending a stream to a form whose fields fill in as the person speaks.</title><style>
.route{stroke:#06cbde;stroke-width:4.2}
.pulse{stroke:#fff;stroke-width:2.3;stroke-dasharray:0.1 37;animation:flow 2.6s linear infinite}
.pulse.slow{animation-duration:3.6s}
@keyframes flow{to{stroke-dashoffset:-36.9}}
.bob{animation:bob 5s ease-in-out infinite}
.bob2{animation:bob 6.5s ease-in-out -2s infinite}
@keyframes bob{50%{transform:translateY(-6.4px)}}
.ring{animation:ring 3.2s ease-in-out infinite}
.ring2{animation-delay:.4s}.ring3{animation-delay:.8s}
@keyframes ring{0%,100%{opacity:1}50%{opacity:.25}}
